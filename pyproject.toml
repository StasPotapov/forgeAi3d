[project]
name = "forge3d"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "build123d>=0.11.1",
    "manifold3d>=3.5.2",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "rtree>=1.4.1",
    "trimesh>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.uv]
package = true
